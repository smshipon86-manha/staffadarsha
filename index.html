<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>আদর্শ ডায়াগনস্টিক সেন্টার - স্টাফ সিরিয়াল এন্ট্রি</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--primary:#0d8a72;--danger:#dc2626;--bg:#f4f7f6;--border-color:#d1d5db}
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:#1f2937;padding-bottom:20px}

/* মোবাইল হেডার */
.app-header{background:#fff;padding:12px 15px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08);position:sticky;top:0;z-index:10}
.app-title{color:var(--primary);font-size:18px;font-weight:700}
.app-subtitle{font-size:12px;color:#6b7280;margin-top:2px}
.status{font-size:11px;color:#6b7280;display:block;margin-top:4px;font-weight:600}

.container{max-width:760px;margin:12px auto;padding:0 10px}
.card{background:#fff;padding:15px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.card-title{font-size:15px;font-weight:700;margin-bottom:12px;color:var(--primary);text-align:center}

/* ফর্ম গ্রিড - মোবাইলে একক কলাম */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:12px;font-weight:700;color:#374151}

/* ইনপুট ফিল্ড মোবাইল ফ্রেন্ডলি */
.input-control{padding:10px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;outline:none;width:100%;background:#fff;min-height:42px;cursor:pointer;-webkit-appearance:none}
.input-control:disabled{background:#f3f4f6;cursor:not-allowed;color:#9ca3af}

.btn-submit{grid-column:span 2;background:var(--primary);color:#fff;border:0;padding:12px;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;margin-top:5px;width:100%;min-height:45px}
.btn-submit:disabled{background:#9ca3af;cursor:not-allowed}

/* পপআপ মডাল */
.modal{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.5);align-items:center;justify-content:center;padding:15px}
.modal-content{background:#fff;padding:18px;border-radius:14px;width:100%;max-width:420px;max-height:85vh;overflow-y:auto;box-shadow:0 10px 25px rgba(0,0,0,.2)}
.success-icon{text-align:center;color:#16a34a;font-size:48px;line-height:1;margin-bottom:6px}
.success-title{text-align:center;color:var(--primary);font-size:17px;font-weight:800}
.thanks{text-align:center;color:#4b5563;font-size:13px;margin-bottom:10px}
.detail-box{background:#f9fafb;border-radius:10px;padding:10px;border:1px solid #e5e7eb}
.detail-box div{padding:5px 0;border-bottom:1px solid #f3f4f6;font-size:13.5px;line-height:1.4}
.detail-box div:last-child{border-bottom:0}
.modal-close{display:block;margin:12px auto 0;background:var(--danger);color:#fff;border:0;padding:10px 24px;border-radius:8px;font-weight:700;cursor:pointer;width:100%}

.note{font-size:11px;color:#6b7280;text-align:center;margin-top:8px}
.today-card{margin-top:12px}
.serial-list{width:100%}
.doctor-columns{display:flex;flex-direction:column;gap:12px}
.doctor-column{border:1.5px solid var(--border-color);border-radius:8px;overflow:hidden;background:#fff}
.doctor-column-title{text-align:center;font-weight:800;padding:8px;font-size:13.5px;border-bottom:1.5px solid var(--border-color)}
.doctor-column-date{font-size:11.5px;color:#dc2626;font-weight:700;margin-top:2px}

/* এক্সেল টেবিল মোবাইল ফিট */
.excel-table{width:100%;border-collapse:collapse;text-align:center;background:#ffffff;table-layout:fixed}
.excel-table th, .excel-table td{border:1px solid var(--border-color);padding:6px 3px;font-size:11.5px;word-wrap:break-word;background:#ffffff}
.excel-table th{background:#f3f4f6;color:#1f2937;font-weight:700;font-size:11px}

/* রোগীর নাম বোল্ড ব্ল্যাক */
.patient-name-bold{font-weight:800;color:#000000;font-size:12px}
.serial-no{font-weight:800;color:var(--primary);font-size:12px}
.serial-time{color:#0d8a72;font-weight:700;font-size:10.5px}
.empty-serial{text-align:center;color:#6b7280;padding:15px;font-size:12.5px}

/* ক্রেডিট */
.footer-credit{text-align:right;margin-top:12px;padding-right:4px;font-size:11px;color:#6b7280;font-weight:600;font-style:italic}

/* মোবাইল রেসপন্সিভ মিডিয়া কোয়েরি */
@media(max-width:600px){
  .form-grid{grid-template-columns:1fr}
  .btn-submit{grid-column:span 1}
  .form-group[style*="grid-column: span 2"]{grid-column:span 1 !important}
}
</style>
</head>
<body>
<header class="app-header">
  <div class="app-title"><i class="fa-solid fa-hospital"></i> আদর্শ ডায়াগনস্টিক সেন্টার</div>
  <div class="app-subtitle">স্টাফ সিরিয়াল এন্ট্রি</div>
  <span id="online-status" class="status"><i class="fa-solid fa-spinner fa-spin"></i> সংযোগ পরীক্ষা হচ্ছে...</span>
</header>

<div class="container">
  <div class="card">
    <div class="card-title"><i class="fa-solid fa-user-plus"></i> নতুন সিরিয়াল এন্ট্রি করুন</div>
    <form class="form-grid" id="serial-form" onsubmit="addSerial(event)">
      
      <!-- ১. তারিখ নির্বাচন -->
      <div class="form-group">
        <label>তারিখ নির্বাচন করুন</label>
        <input type="date" id="input-date" class="input-control" onclick="try{this.showPicker()}catch(e){}" required>
      </div>

      <!-- ২. ডাক্তারের নাম -->
      <div class="form-group">
        <label>ডাক্তারের নাম</label>
        <select id="input-doctor" class="input-control" required>
          <option value="">-- ডাক্তার সিলেক্ট করুন --</option>
        </select>
      </div>

      <!-- ৩. রোগীর নাম -->
      <div class="form-group">
        <label>রোগীর নাম</label>
        <input type="text" id="input-pname" class="input-control" placeholder="রোগীর নাম লিখুন" required autocomplete="off">
      </div>

      <!-- ৪. গ্রামের নাম -->
      <div class="form-group">
        <label>গ্রামের নাম</label>
        <input type="text" id="input-village" class="input-control" placeholder="গ্রামের নাম লিখুন" required autocomplete="off">
      </div>

      <!-- ৫. রোগীর ধরন -->
      <div class="form-group">
        <label>রোগীর ধরন</label>
        <select id="input-patient-type" class="input-control" required>
          <option value="">-- রোগীর ধরন নির্বাচন করুন --</option>
          <option value="নতুন">নতুন</option>
          <option value="পুরাতন">পুরাতন</option>
        </select>
      </div>

      <!-- ৬. রোগীর মোবাইল নাম্বার -->
      <div class="form-group">
        <label>রোগীর মোবাইল নাম্বার</label>
        <input type="tel" id="input-phone" class="input-control" placeholder="ঐচ্ছিক" autocomplete="off">
      </div>

      <!-- ৭. সিরিয়াল প্রদানকারী ব্যক্তি -->
      <div class="form-group" style="grid-column: span 2;">
        <label>সিরিয়াল প্রদানকারী ব্যক্তি</label>
        <input type="text" id="input-operator" class="input-control" list="operator-datalist" placeholder="স্টাফের নাম লিখুন" autocomplete="off" style="cursor:text;" required>
        <datalist id="operator-datalist"></datalist>
      </div>

      <button type="submit" class="btn-submit" id="submit-btn">সিরিয়াল কনফার্ম করুন</button>
    </form>
    <div class="note">স্টাফ লিংক: এখানে শুধু নতুন সিরিয়াল এন্ট্রি করা যাবে।</div>
  </div>

  <div class="card today-card">
    <div class="card-title" id="doctor-list-title"><i class="fa-solid fa-list-ol"></i> ডাক্তারের সিরিয়াল তালিকা</div>
    <div id="today-serial-list" class="serial-list">
      <div class="empty-serial">তারিখ নির্বাচন করলে আজকের সিরিয়ালগুলো এখানে দেখা যাবে।</div>
    </div>
  </div>

  <!-- ক্রেডিট বার্তা -->
  <div class="footer-credit">Developed by Shipon</div>
</div>

<div id="infoModal" class="modal">
  <div class="modal-content">
    <div class="success-icon"><i class="fa-solid fa-circle-check"></i></div>
    <div class="success-title">সিরিয়াল দেওয়া সম্পন্ন হয়েছে</div>
    <div class="thanks">ধন্যবাদ</div>
    <div id="modal-text" class="detail-box"></div>
    <button type="button" class="modal-close" onclick="closeModal()">বন্ধ করুন</button>
  </div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,addDoc,onSnapshot,getDocs,query,where} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyDdSS-T4oCORhTmaeFxEIr2vNtyolLOHfw",
 authDomain:"dhunatseed-d95cc.firebaseapp.com",
 projectId:"dhunatseed-d95cc",
 storageBucket:"dhunatseed-d95cc.firebasestorage.app",
 messagingSenderId:"453032990987",
 appId:"1:453032990987:web:54829f2b092b3c392e6a0e",
 measurementId:"G-XBM8J33J3X"
};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);
let doctorDocs=[],operatorDocs=[],todayDoctorUnsub=null;

/* আলাদা আলাদা ডাক্তারের জন্য সুন্দর কালার প্যালেট */
const doctorColors = [
  { bg: "#e6f4f1", text: "#0d8a72", border: "#a3d9cf" },
  { bg: "#fef3c7", text: "#b45309", border: "#fde68a" },
  { bg: "#e0e7ff", text: "#4338ca", border: "#c7d2fe" },
  { bg: "#fce7f3", text: "#be185d", border: "#fbcfe8" },
  { bg: "#dcfce7", text: "#15803d", border: "#86efac" },
  { bg: "#ffedd5", text: "#c2410c", border: "#fed7aa" },
  { bg: "#f3e8ff", text: "#7e22ce", border: "#e9d5ff" },
  { bg: "#e0f2fe", text: "#0369a1", border: "#bae6fd" }
];

function getDoctorTheme(index) {
  return doctorColors[index % doctorColors.length];
}

/* অফলাইনে সকল ফিল্ড লক/ডিজেবল করার ফাংশন */
function updateInternetStatus(){
 const status=document.getElementById('online-status'),btn=document.getElementById('submit-btn');
 const formElements=document.querySelectorAll('#serial-form input, #serial-form select');
 
 if(navigator.onLine){
   status.innerHTML='<i class="fa-solid fa-circle" style="color:#16a34a"></i> ইন্টারনেট সংযুক্ত';
   btn.disabled=false;
   btn.innerText='সিরিয়াল কনফার্ম করুন';
   formElements.forEach(el => el.disabled = false);
 }else{
   status.innerHTML='<i class="fa-solid fa-circle" style="color:#dc2626"></i> ইন্টারনেট সংযোগ নেই (বন্ধ)';
   btn.disabled=true;
   btn.innerText='অফলাইনে সিরিয়াল দেওয়া যাবে না';
   formElements.forEach(el => el.disabled = true);
 }
}
window.addEventListener('online',updateInternetStatus);
window.addEventListener('offline',updateInternetStatus);

function fillDoctors(){
 const s=document.getElementById('input-doctor'),old=s.value;s.innerHTML='<option value="">-- ডাক্তার সিলেক্ট করুন --</option>';
 doctorDocs.forEach(x=>{const o=document.createElement('option');o.value=x.name;o.textContent=x.name;s.appendChild(o)});if(doctorDocs.some(x=>x.name===old))s.value=old;
}

function fillOperators(){
 const dl=document.getElementById('operator-datalist');
 dl.innerHTML='';
 operatorDocs.forEach(x=>{const o=document.createElement('option');o.value=x.name;dl.appendChild(o);});
}

onSnapshot(collection(db,'doctors'),snap=>{doctorDocs=snap.docs.map(d=>({id:d.id,name:d.data().name||''})).filter(x=>x.name);fillDoctors();},err=>console.error('Doctors listener:',err));
onSnapshot(collection(db,'operators'),snap=>{operatorDocs=snap.docs.map(d=>({id:d.id,name:d.data().name||''})).filter(x=>x.name);fillOperators();},err=>console.error('Operators listener:',err));

function formatDateBD(v){if(!v)return '';const p=v.split('-');return p.length===3?`${p[2]}-${p[1]}-${p[0]}`:v;}
function safe(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

const SHAFIUL_NAMES=['শাফিউল আজম','ডাঃ শাফিউল আজম','ডা. শাফিউল আজম','ডাক্তার শাফিউল আজম'];
function isShaifulDoctor(name){const n=String(name||'').replace(/\s+/g,' ').trim();return SHAFIUL_NAMES.some(x=>n===x||n.includes('শাফিউল আজম'));}

/* সময় ১২-ঘন্টা AM/PM ফরমেট করার হেল্পার ফংশন */
function formatHour12(h){
  const period = h >= 12 ? 'PM' : 'AM';
  let hour12 = h % 12;
  if(hour12 === 0) hour12 = 12;
  return `${hour12}:00 ${period}`;
}

function getShaifulSpecial(n){
  const tenBlock=Math.floor((n-1)/10);
  if(tenBlock===0) return (n<=3||n>=9);
  return (n%10===9||n%10===0);
}

function getShaifulSlot(n){
  n=parseInt(n,10);
  if(!Number.isFinite(n)||n<1)return null;
  // সময়ের ব্লক: প্রতি ২০টি সিরিয়ালে ১ ঘন্টা (স্পেশাল নাম্বার প্যাটার্ন আগের ১০-ভিত্তিক নিয়মেই অপরিবর্তিত)
  const hourBlock=Math.floor((n-1)/20),start=8+hourBlock,end=start+1;
  const timeStr = `${formatHour12(start)} - ${formatHour12(end)}`;
  return {special:getShaifulSpecial(n),time:timeStr};
}

function nextSerialNumberForDoctor(items, doctor) {
  if (!isShaifulDoctor(doctor)) {
    return items.map(x => parseInt(x.serialNo, 10)).filter(Number.isFinite).reduce((m, v) => Math.max(m, v), 0) + 1;
  }
  
  const usedSerials = new Set(items.map(x => parseInt(x.serialNo, 10)).filter(Number.isFinite));
  let candidate = 1;
  while (true) {
    const slot = getShaifulSlot(candidate);
    if (slot && !slot.special && !usedSerials.has(candidate)) {
      return candidate;
    }
    candidate++;
  }
}

window.addSerial=async function(event){
 event.preventDefault();if(!navigator.onLine){alert('ইন্টারনেট সংযোগ নেই। অনলাইনে এসে আবার চেষ্টা করুন।');return;}
 const dateInput=document.getElementById('input-date'),date=dateInput.value;
 const pname=document.getElementById('input-pname').value.trim(),phone=document.getElementById('input-phone').value.trim(),village=document.getElementById('input-village').value.trim(),doctor=document.getElementById('input-doctor').value,patientType=document.getElementById('input-patient-type').value,btn=document.getElementById('submit-btn');
 
 const operator=document.getElementById('input-operator').value.trim();

 if(!date||!pname||!village||!doctor||!patientType||!operator){alert('দয়া করে প্রয়োজনীয় সকল তথ্য পূরণ করুন।');return;}
 btn.disabled=true;btn.innerText='সংরক্ষণ হচ্ছে...';
 try{
  const q=query(collection(db,'diagnostic_serials'),where('date','==',date),where('doctor','==',doctor));const existing=await getDocs(q);const items=existing.docs.map(d=>d.data());
  const isShaiful=isShaifulDoctor(doctor);
  
  const nextNo=nextSerialNumberForDoctor(items,doctor);
  const serialNo=String(nextNo).padStart(3,'0');
  const slot=isShaiful?getShaifulSlot(nextNo):null;
  
  const docData={date,pname,phone:phone||'দেওয়া হয়নি',village,doctor,patientType,operator,serialNo,timeSlot:slot?.time||'',timestamp:new Date().toISOString()};
  await addDoc(collection(db,'diagnostic_serials'),docData);
  
  showSuccessDetails(docData,isShaiful);
  
  document.getElementById('serial-form').reset();
  watchDoctorSerials();
 }catch(e){alert('সমস্যা হয়েছে: '+e.message);}finally{updateInternetStatus();}
};

function showSuccessDetails(item,isShaiful){
 let timeHtml = isShaiful && item.timeSlot ? `<div><b>সময়:</b> <span style="color:#0d8a72;font-weight:700;">${safe(item.timeSlot)}</span></div>` : '';
 document.getElementById('modal-text').innerHTML=`
 <div><b>সিরিয়াল নাম্বার:</b> ${safe(item.serialNo)}</div>
 ${timeHtml}
 <div><b>তারিখ:</b> ${safe(formatDateBD(item.date))}</div>
 <div><b>রোগীর নাম:</b> ${safe(item.pname)}</div>
 <div><b>মোবাইল নাম্বার:</b> ${safe(item.phone)}</div>
 <div><b>গ্রামের নাম:</b> ${safe(item.village)}</div>
 <div><b>রোগীর ধরন:</b> ${safe(item.patientType)}</div>
 <div><b>ডাক্তারের নাম:</b> ${safe(item.doctor)}</div>
 <div><b>সিরিয়াল প্রদানকারী:</b> ${safe(item.operator)}</div>`;
 document.getElementById('infoModal').style.display='flex';
}
window.closeModal=()=>document.getElementById('infoModal').style.display='none';

function renderTodaySerials(items,doctor,date){
 const box=document.getElementById('today-serial-list'),title=document.getElementById('doctor-list-title');
 title.innerHTML='<i class="fa-solid fa-list-ol"></i> ডাক্তারের সিরিয়ালের তালিকা';
 if(!date){box.innerHTML='<div class="empty-serial">তারিখ নির্বাচন করলে আজকের সিরিয়ালগুলো এখানে দেখা যাবে।</div>';return;}
 const groups={};items.forEach(x=>(groups[x.doctor||'ডাক্তার']??=[]).push(x));
 const docs=Object.keys(groups).sort((a,b)=>a.localeCompare(b,'bn'));
 if(!docs.length){box.innerHTML='<div class="empty-serial">এই তারিখে কোনো সিরিয়াল দেওয়া হয়নি।</div>';return;}
 box.className='doctor-columns';
 box.innerHTML=docs.map((d, idx)=>{
  const theme = getDoctorTheme(idx);
  const isShaiful=isShaifulDoctor(d);
  const typeBadge = (t) => t ? `<span style="background:${t==='নতুন'?'#dcfce7':'#fef3c7'}; color:${t==='নতুন'?'#15803d':'#b45309'}; padding: 2px 7px; border-radius: 4px; font-weight: bold; font-size: 11px;">${safe(t)}</span>` : '<span style="color:#aaa; font-size:11px;">-</span>';

  const rows=groups[d].sort((a,b)=>(parseInt(a.serialNo)||0)-(parseInt(b.serialNo)||0)).map(x=>{
    if(isShaiful){
      return `<tr><td class="serial-no" style="color:${theme.text}">${safe(x.serialNo)}</td><td class="serial-time">${safe(x.timeSlot||'--')}</td><td class="patient-name-bold">${safe(x.pname)}</td><td>${safe(x.village)}</td><td>${typeBadge(x.patientType)}</td><td>${safe(x.operator)}</td></tr>`;
    }else{
      return `<tr><td class="serial-no" style="color:${theme.text}">${safe(x.serialNo)}</td><td class="patient-name-bold">${safe(x.pname)}</td><td>${safe(x.village)}</td><td>${typeBadge(x.patientType)}</td><td>${safe(x.operator)}</td></tr>`;
    }
  }).join('');
  
  const headHtml = isShaiful 
    ? `<tr><th style="width:14%">সিরিয়াল</th><th style="width:20%">সময়</th><th style="width:22%">রোগীর নাম</th><th style="width:15%">গ্রাম</th><th style="width:14%">রোগীর ধরন</th><th style="width:15%">স্টাফ</th></tr>`
    : `<tr><th style="width:17%">সিরিয়াল</th><th style="width:29%">রোগীর নাম</th><th style="width:18%">গ্রাম</th><th style="width:18%">রোগীর ধরন</th><th style="width:18%">স্টাফ</th></tr>`;

  return `<div class="doctor-column" style="border-color:${theme.border}"><div class="doctor-column-title" style="background:${theme.bg}; color:${theme.text}; border-color:${theme.border}">${safe(d)} <div class="doctor-column-date">তারিখ: ${safe(formatDateBD(date))}</div></div><table class="excel-table"><thead>${headHtml}</thead><tbody>${rows}</tbody></table></div>`;
 }).join('');
}

function watchDoctorSerials(){
 const date=document.getElementById('input-date').value;
 if(todayDoctorUnsub){todayDoctorUnsub();todayDoctorUnsub=null;}
 if(!date){renderTodaySerials([],null,date);return;}
 const q=query(collection(db,'diagnostic_serials'),where('date','==',date));
 todayDoctorUnsub=onSnapshot(q,snap=>renderTodaySerials(snap.docs.map(d=>d.data()),null,date),err=>console.error('Serial listener:',err));
}

document.getElementById('input-date').addEventListener('change',function(){watchDoctorSerials();});
updateInternetStatus();
</script>
